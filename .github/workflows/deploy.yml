name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 23:10 UTC on weekdays. ICE BofA OAS series post to FRED with roughly a
    # one-business-day lag, so this reliably catches the previous session's mark.
    - cron: '10 23 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run parser tests
        run: node --test scripts/fetch-fred.test.mjs

      - name: Pull end-of-day marks from FRED
        run: npm run fetch
        env:
          # Optional. Without it the script uses the public CSV endpoint instead.
          # Set at Settings → Secrets and variables → Actions → New repository secret.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
