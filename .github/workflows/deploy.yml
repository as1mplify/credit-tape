name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 23:10 UTC on weekdays. ICE BofA OAS series post to FRED with roughly a
    # one-business-day lag, so this reliably catches the previous session's mark.
    - cron: '10 23 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run parser tests
        run: node --test scripts/fetch-fred.test.mjs

      - name: Pull end-of-day marks from FRED
        run: npm run fetch
        env:
          # Optional. Without it the script uses the public CSV endpoint instead.
          # Set at Settings → Secrets and variables → Actions → New repository secret.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Print feed URL
        run: echo "Feed URL: https://raw.githubusercontent.com/${{ github.repository }}/main/public/"

      # Optional: only runs if you later enable Pages and set the ENABLE_PAGES
      # repository variable to "true" (Settings → Secrets and variables →
      # Actions → Variables). Skipped by default — raw.githubusercontent.com
      # above is the feed WordPress actually needs.
      - uses: actions/configure-pages@v5
        if: vars.ENABLE_PAGES == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true'
        with:
          path: public

  deploy:
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
